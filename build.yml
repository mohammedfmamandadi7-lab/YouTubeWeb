name: Build YouTubeWeb APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Extract project ZIP
    run: |
      mkdir extracted
      unzip -o YouTubeWeb-Android-Project.zip -d extracted
      echo "=== Project files ==="
      find extracted/YouTubeWeb -maxdepth 3 -type f

  - name: Build APK
    run: |
      cd extracted/YouTubeWeb
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: YouTubeWeb-APK
      path: extracted/YouTubeWeb/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
