name: Build YouTubeWeb APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o YouTubeWeb-Android-Project.zip -d extracted

            - name: Build APK
        run: |
          cd extracted/YouTubeWeb
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeWeb-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
